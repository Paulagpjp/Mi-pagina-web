# El sitio se exporta como HTML estático (next.config.mjs → output: "export"),
# así que Netlify solo tiene que servir la carpeta out/. No hace falta el
# plugin de Next.js ni ninguna función serverless.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# NOTA (26 ago 2026): Netlify inyecta en el <head> de cada página un comentario
# HTML y dos <meta> de atribución (hosting-provider / netlify-deploy). El App
# Router de Next hidrata el documento entero, así que esos nodos extra rompen la
# hidratación de React (#418 → #423) y la página se re-renderiza en cliente.
# Verificado por bisección: el mismo out/ servido en local da 100 en buenas
# prácticas y cero errores; basta con añadir el comentario O los <meta> para
# reproducir los 4 errores. skip_processing NO lo desactiva y no hay opción
# documentada para hacerlo. En Vercel no ocurre.
[build.processing]
  skip_processing = true

# Los archivos de /_next/static/ llevan un hash en el nombre: si cambia el
# contenido, cambia la URL. Se pueden cachear para siempre. Por defecto Netlify
# los servía con max-age=0, obligando a revalidar en cada visita.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las imágenes de /public no llevan hash: caché corta y revalidación, para que
# al cambiar la foto no se quede la vieja pegada en el navegador de nadie.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
